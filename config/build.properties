# =============================================================================
#  BUILD CONFIG - identity and version of the app.
#  Read by app/build.gradle.kts. Edit here, never in the Gradle files.
# =============================================================================

# Unique id of the app on the phone. NEVER change it after the first install,
# otherwise new versions cannot update the old one (data would be lost).
app.id=com.vislupus.mindmath

# Name shown under the launcher icon.
app.name=MindMath

# Increase versionCode by 1 for every new release and update versionName.
app.versionCode=1
app.versionName=1.0.0

# Android SDK levels (minSdk 26 = Android 8.0).
sdk.compile=35
sdk.target=35
sdk.min=26

# Release signing key. It is created automatically in keystore/ on the first
# release build. Do not change these values after the first release.
signing.storeFile=keystore/mindmath-release.jks
signing.storePassword=mindmath-release
signing.keyAlias=mindmath
signing.keyPassword=mindmath-release
